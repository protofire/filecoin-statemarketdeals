x-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "2m"
      max-file: "10"

networks:
  filexp:
    driver: bridge

volumes:
  filexp-mainnet-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOST_OUTPUT_DIR}/mainnet
  filexp-mainnet-ndjson-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOST_OUTPUT_DIR}/mainnet
  filexp-calibration-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOST_OUTPUT_DIR}/calibration
  filexp-calibration-ndjson-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOST_OUTPUT_DIR}/calibration

services:
  mainnet:
    image: ${IMAGE_MAINNET}
    restart: no
    environment:
      FILE_NAME: ${FILE_NAME}
      RPC_FULLNODE: ${RPC_FULLNODE_MAINNET}
      BUCKET_NAME: ${BUCKET_NAME_MAINNET}
      DISABLE_SINGLE_DOCUMENT: "false"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
    volumes:
      - filexp-mainnet-data:/filexp
    networks:
      - filexp
    <<: *default-logging

  mainnet-ndjson:
    image: ${IMAGE_MAINNET}
    restart: no
    environment:
      FILE_NAME: ${FILE_NAME}
      RPC_FULLNODE: ${RPC_FULLNODE_MAINNET}
      BUCKET_NAME: ${BUCKET_NAME_MAINNET}
      DISABLE_SINGLE_DOCUMENT: "true"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
    volumes:
      - filexp-mainnet-ndjson-data:/filexp
    networks:
      - filexp
    <<: *default-logging
  
  calibration:
    image: ${IMAGE_CALIBRATION}
    restart: no
    environment:
      FILE_NAME: ${FILE_NAME}
      RPC_FULLNODE: ${RPC_FULLNODE_CALIBRATION}
      BUCKET_NAME: ${BUCKET_NAME_CALIBRATION}
      DISABLE_SINGLE_DOCUMENT: "false"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
    volumes:
      - filexp-calibration-data:/filexp
    networks:
      - filexp
    <<: *default-logging
  
  calibration-ndjson:
    image: ${IMAGE_CALIBRATION}
    restart: no
    environment:
      FILE_NAME: ${FILE_NAME}
      RPC_FULLNODE: ${RPC_FULLNODE_CALIBRATION}
      BUCKET_NAME: ${BUCKET_NAME_CALIBRATION}
      DISABLE_SINGLE_DOCUMENT: "true"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
    volumes:
      - filexp-calibration-ndjson-data:/filexp
    networks:
      - filexp
    <<: *default-logging

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ${HOST_OUTPUT_DIR}:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - filexp
    <<: *default-logging
