x-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "2m"
      max-file: "10"

networks:
  filexp:
    driver: bridge

volumes:
  filexp-mainnet-data:
  filexp-mainnet-ndjson-data:
  filexp-calibration-data:
  filexp-calibration-ndjson-data:

services:
  mainnet:
    image: ${IMAGE_MAINNET}
    restart: no
    environment:
      FILE_NAME: ${FILE_NAME}
      RPC_FULLNODE: ${RPC_FULLNODE_MAINNET}
      BUCKET_NAME: ${BUCKET_NAME_MAINNET}
      DISABLE_SINGLE_DOCUMENT: "false"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
    volumes:
      - filexp-mainnet-data:/filexp
    networks:
      - filexp
    <<: *default-logging

  mainnet-ndjson:
    image: ${IMAGE_MAINNET}
    restart: no
    environment:
      FILE_NAME: ${FILE_NAME}
      RPC_FULLNODE: ${RPC_FULLNODE_MAINNET}
      BUCKET_NAME: ${BUCKET_NAME_MAINNET}
      DISABLE_SINGLE_DOCUMENT: "true"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
    volumes:
      - filexp-mainnet-ndjson-data:/filexp
    networks:
      - filexp
    <<: *default-logging
  
  calibration:
    image: ${IMAGE_CALIBRATION}
    restart: no
    environment:
      FILE_NAME: ${FILE_NAME}
      RPC_FULLNODE: ${RPC_FULLNODE_CALIBRATION}
      BUCKET_NAME: ${BUCKET_NAME_CALIBRATION}
      DISABLE_SINGLE_DOCUMENT: "false"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
    volumes:
      - filexp-calibration-data:/filexp
    networks:
      - filexp
    <<: *default-logging
  
  calibration-ndjson:
    image: ${IMAGE_CALIBRATION}
    restart: no
    environment:
      FILE_NAME: ${FILE_NAME}
      RPC_FULLNODE: ${RPC_FULLNODE_CALIBRATION}
      BUCKET_NAME: ${BUCKET_NAME_CALIBRATION}
      DISABLE_SINGLE_DOCUMENT: "true"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
    volumes:
      - filexp-calibration-ndjson-data:/filexp
    networks:
      - filexp
    <<: *default-logging