server {
    listen 80;
    server_name marketdeals.filecoin.chain.love;

    default_type application/octet-stream;

    location = /mainnet.ndjson.zst {
        alias /usr/share/nginx/html/mainnet/StateMarketDeals.ndjson.zst;
    }

    location = /mainnet.json.zst {
        alias /usr/share/nginx/html/mainnet/StateMarketDeals.json.zst;
    }

    location = /calibration.ndjson.zst {
        alias /usr/share/nginx/html/calibration/StateMarketDeals.ndjson.zst;
    }

    location = /calibration.json.zst {
        alias /usr/share/nginx/html/calibration/StateMarketDeals.json.zst;
    }

    location / {
        return 404;
    }
}
